name: CI Release

on:
  pull_request:
    branches:
      - release
    types:
      - opened
      - synchronize
  workflow_dispatch: 
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Start Linting
        run: echo "Starting HTML and CSS linting"
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install Dev Dependencies
        run: npm install
      - name: Lint HTML
        run: npx htmlhint "pages/**/*.html"
      - name: Lint CSS
        run: npx stylelint "styles/**/*.css"

  build-job:
    runs-on: ubuntu-latest
    needs: linting-job
    steps:
      - name: Build website
        run: echo "Starting build job"
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: npm install
      - name: Build Web with Parcel
        run: npx parcel build "./pages/index.html" --dist-dir "./dist" --public-url "./" --no-cache

  image-build-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_NAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker Image
        run: docker image build -t ${{ secrets.DOCKERHUB_NAME }}/university-department:release .
      - name: Run Docker Container
        run: docker container run -d -p 2222:80 ${{ secrets.DOCKERHUB_NAME }}/university-department:release
      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_NAME }}/university-department:release
