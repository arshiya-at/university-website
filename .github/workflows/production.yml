name: CI - Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint HTML
        run: npx htmlhint .

      - name: Lint CSS
        run: npx stylelint "styles/**/*.css"

      - name: Docker Build (Production)
        run: docker build -t university-website-prod .
