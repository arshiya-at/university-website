name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/release' && 'staging' || 'development' }}
    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker Buildx
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Step 3: Build Docker image
      - name: Build Docker image
        run: docker build -t university-website:latest .

      # Step 4: Login to Docker Hub (if using Docker Hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Step 5: Optional: Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker tag university-website:latest ${{ secrets.DOCKERHUB_USERNAME }}/university-website:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/university-website:latest

      # Step 6: Deploy to Render
      - name: Deploy to Render
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"serviceId":"<RENDER_SERVICE_ID>"}' \
          https://api.render.com/deploy/srv-xxxxxxxxxx
